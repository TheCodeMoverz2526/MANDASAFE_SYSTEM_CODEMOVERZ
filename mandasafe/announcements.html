<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcements — MandaSafe</title>
<link rel="icon" href="assets/seal.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<main class="main">
  <div class="page-head"><div><h1>Announcements</h1>
    <p>Safety advisories generated from the city's own incident records.</p></div></div>

  <div class="card">
    <div id="list"><div class="empty">Loading…</div></div>
    <div class="src">These advisories are produced automatically from the latest data. Formal traffic
      advisories are issued by the Mandaluyong City Traffic Planning and Management Office.</div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
if (requireAuth()) {
  buildShell('announce');
  (async () => {
    let s, predictions;
    try { [s, predictions] = await Promise.all([API.summary(), API.predictions()]); }
    catch (error) { setState(document.getElementById('list'), error.message, true); return; }

    const items = [];
    const top = s.byBarangay[0];
    const rising = predictions.filter(p => p.trend === 'up').slice(0, 3);
    const highRisk = predictions.filter(p => p.riskLevel === 'high');
    const lastMonth = s.byMonth[s.byMonth.length - 1];
    const prevMonth = s.byMonth[s.byMonth.length - 2];

    if (highRisk.length) items.push({
      tag: 'High risk', title: `${highRisk.length} area${highRisk.length === 1 ? '' : 's'} flagged high-risk`,
      body: `${highRisk.map(p => p.barangay).join(', ')} — take extra care along these routes. ` +
            `The forecast expects about ${num(highRisk[0].predictedNextMonth)} incidents next month in ${highRisk[0].barangay}.`,
      date: s.range.to
    });

    if (top) items.push({
      tag: '', title: `${top.barangay} records the most incidents`,
      body: `${num(top.count)} of ${num(s.totalIncidents)} recorded incidents (${Math.round(top.count / s.totalIncidents * 100)}%) happened in ${top.barangay}. Plan alternate routes during rush hour.`,
      date: s.range.to
    });

    if (lastMonth && prevMonth) {
      const diff = lastMonth.count - prevMonth.count;
      items.push({
        tag: '', title: diff > 0 ? 'Incidents rose last month' : diff < 0 ? 'Incidents fell last month' : 'Incidents held steady last month',
        body: `${fmtMonth(lastMonth.month)} recorded ${num(lastMonth.count)} incidents versus ${num(prevMonth.count)} in ${fmtMonth(prevMonth.month)} ` +
              `(${diff >= 0 ? '+' : ''}${diff}).`,
        date: lastMonth.month + '-01'
      });
    }

    rising.forEach(p => items.push({
      tag: '', title: `Rising trend in ${p.barangay}`,
      body: `Incident counts in ${p.barangay} are trending upward; about ${num(p.predictedNextMonth)} are forecast for next month (risk score ${p.riskScore.toFixed(1)}/10).`,
      date: s.range.to
    }));

    items.push({
      tag: '', title: 'Emergency hotlines',
      body: 'For accidents in progress call 911 (national emergency), 136 (MMDA), or the Mandaluyong City DRRMO at 532-5001.',
      date: s.range.to
    });

    document.getElementById('list').innerHTML = items.map(a => {
      const d = new Date(a.date + (a.date.length === 10 ? 'T00:00:00' : ''));
      return `<div class="ann">
        <div class="datebox"><div class="mo">${d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase()}</div>
          <div class="dy">${String(d.getDate()).padStart(2, '0')}</div></div>
        <div><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p></div>
        <div class="meta">${a.tag ? `<span class="tag t-new">${esc(a.tag)}</span>` : ''}</div></div>`;
    }).join('');
  })();
}
</script>
</body>
</html>
