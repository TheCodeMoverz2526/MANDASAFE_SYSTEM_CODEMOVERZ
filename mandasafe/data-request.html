<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Data — MandaSafe</title>
<link rel="icon" href="assets/logo-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<main class="main">
  <div class="page-head"><div><h1>Request Data</h1>
    <p>Ask the office for a copy of the accident data behind MandaSafe.</p></div></div>

  <div class="grid g-2">
    <div class="card">
      <div class="card-head"><h2>Data Request Form</h2></div>
      <div class="card-body">
        <form id="requestForm" novalidate>
          <div class="field"><label for="reqName">Name</label>
            <input class="input" id="reqName" autocomplete="name" required></div>

          <div class="field"><label>Role</label>
            <div class="seg" role="radiogroup" aria-label="Role">
              <input type="radio" name="role" id="roleStudent" value="Student"><label class="sv-blue" for="roleStudent">Student</label>
              <input type="radio" name="role" id="roleResearcher" value="Researcher"><label class="sv-blue" for="roleResearcher">Researcher</label>
              <input type="radio" name="role" id="roleEmployee" value="Employee"><label class="sv-blue" for="roleEmployee">Employee</label>
              <input type="radio" name="role" id="roleOthers" value="Others"><label class="sv-blue" for="roleOthers">Others</label>
            </div>
            <input class="input" id="reqRoleOther" placeholder="Please specify your role" style="margin-top:10px" hidden></div>

          <div class="field"><label for="reqOrg">Organization</label>
            <input class="input" id="reqOrg" autocomplete="organization" placeholder="School, company or office" required></div>

          <div class="field"><label for="reqType">Type of Data Request</label>
            <select class="input" id="reqType" required>
              <option value="">Choose the data you need…</option>
              <option>Accident records</option>
              <option>Accident hotspots</option>
              <option>Accident forecast</option>
              <option>Safety Index</option>
              <option>Barangay statistics</option>
              <option>Other data</option>
            </select></div>

          <div class="field"><label for="reqPurpose">Purpose of Request</label>
            <textarea class="input" id="reqPurpose" maxlength="1000" placeholder="Tell us how the data will be used" required></textarea>
            <div class="counter"><span id="purposeCount">0</span> / 1000</div></div>

          <div class="field"><label>How do you want the data?</label>
            <div class="seg seg-stack" role="radiogroup" aria-label="Delivery">
              <input type="radio" name="delivery" id="delSignin" value="signin" checked>
              <label class="sv-blue" for="delSignin">Email I use to sign in <span id="signinEmail" style="opacity:.8;font-weight:500"></span></label>
              <input type="radio" name="delivery" id="delOther" value="other"><label class="sv-blue" for="delOther">Other email</label>
            </div>
            <input class="input" id="reqEmail" type="email" autocomplete="email" placeholder="name@example.com" style="margin-top:10px" hidden></div>

          <div id="requestError" class="notice notice-amber" style="display:none;margin-bottom:16px"></div>
          <button type="submit" class="btn btn-primary" id="requestBtn">Submit Request</button>
        </form>
      </div>
    </div>

    <div class="card" style="align-self:start">
      <div class="card-head"><h2>Request Status</h2></div>
      <div id="tracker"><div class="empty">Loading…</div></div>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
if (requireAuth()) {
  buildShell('request');

  const $ = id => document.getElementById(id);
  const me = currentUser() || {};
  $('reqName').value = me.name || '';
  $('signinEmail').textContent = me.email ? '(' + me.email + ')' : '';

  const selected = name => (document.querySelector('input[name="' + name + '"]:checked') || {}).value || '';
  document.querySelectorAll('input[name="role"]').forEach(r => r.onchange = () => {
    $('reqRoleOther').hidden = selected('role') !== 'Others';
  });
  document.querySelectorAll('input[name="delivery"]').forEach(r => r.onchange = () => {
    $('reqEmail').hidden = selected('delivery') !== 'other';
  });
  $('reqPurpose').oninput = () => { $('purposeCount').textContent = $('reqPurpose').value.length; };

  /* ---------- request tracker: the latest request, step by step ---------- */
  const STEPS = [
    { label: 'Request Submitted', icon: 'file' },
    { label: 'Under Review',      icon: 'search' },
    { label: 'Accepted',          icon: 'checkOnly' },
    { label: 'Data Sent',         icon: 'mail' }
  ];
  // How many steps each status has completed; the next one is the current step.
  const STATUS_DONE = { pending: 1, approved: 3, sent: 4, declined: 1 };
  const STATUS_TAG = { pending: ['Under Review', 't-review'], approved: ['Accepted', 't-process'],
                       sent: ['Data Sent', 't-resolved'], declined: ['Declined', 't-high'] };
  let requestCount = 0;

  const stamp = iso => new Date(iso).toLocaleString([], { month: '2-digit', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  // 5 working days after the request, skipping weekends.
  function expectedBy(iso) {
    const d = new Date(iso);
    for (let left = 5; left > 0;) {
      d.setDate(d.getDate() + 1);
      if (d.getDay() !== 0 && d.getDay() !== 6) left--;
    }
    return d.toLocaleDateString([], { month: '2-digit', day: '2-digit', year: 'numeric' });
  }

  function renderTracker(r) {
    const done = r ? (STATUS_DONE[r.status] ?? 1) : 0;
    const declined = r && r.status === 'declined';

    const steps = STEPS.map((s, i) => {
      let cls = i < done ? 'done' : i === done && r ? 'current' : '';
      let label = s.label;
      let date = '';
      if (declined && i === 1) { cls = 'declined'; label = 'Declined'; }
      if (r && i === 0) date = stamp(r.createdAt);
      if (r && i === 3 && done < 4 && !declined) date = 'by ' + expectedBy(r.createdAt);
      return `<div class="trk-step ${cls}"><div class="dot">${icon(declined && i === 1 ? 'alert' : s.icon)}</div>
        <div><div class="lb">${label}</div>${date ? `<div class="dt">${date}</div>` : ''}</div></div>`;
    }).join('');

    if (!r) {
      $('tracker').innerHTML = `
        <div class="trk-head">No request yet — submit the form to start tracking it here.</div>
        <div class="trk">${steps}</div>
        <div class="trk-row">${icon('clock', 'ri')}<span>The office reviews each request and sends the data within <b>3–5 working days</b>.</span></div>
        <div class="trk-row">${icon('lock', 'ri')}<span>Names and personal details of the people involved in an accident are not included.</span></div>`;
      return;
    }

    const [tagLabel, tag] = STATUS_TAG[r.status] || [r.status, 't-review'];
    const note = declined
      ? (r.declineReason
          ? `This request was declined. <b>Reason:</b> ${esc(r.declineReason)}`
          : 'This request was declined. Contact the TPMO or send a new request.')
      : r.status === 'sent'
        ? `The data was sent to <b>${esc(r.email)}</b>.`
        : `Expect the data at <b>${esc(r.email)}</b> by <b>${expectedBy(r.createdAt)}</b> (3–5 working days).`;

    $('tracker').innerHTML = `
      <div class="trk-head">REQUEST ID <b>REQ-${String(r.id).padStart(4, '0')}</b> · ${esc(r.dataType)}
        <span class="tag ${tag}">${esc(tagLabel)}</span></div>
      <div class="trk">${steps}</div>
      <div class="trk-row">${icon(declined ? 'alert' : 'mail', 'ri')}<span>${note}</span></div>
      <div class="trk-row">${icon('headset', 'ri')}<span>Questions about this request?</span>
        <a class="btn btn-ghost" href="support.html">Contact Support</a></div>
      ${requestCount > 1 ? `<div class="trk-row">${icon('clipboard', 'ri')}<span>You have ${requestCount} requests in total.</span>
        <a class="btn btn-ghost" href="profile.html">View All Requests</a></div>` : ''}`;
  }

  (async () => {
    let requests = [];
    try { requests = await API.dataRequests(); } catch { /* show the empty tracker */ }
    requestCount = requests.length;
    renderTracker(requests[0]);
  })();

  $('requestForm').onsubmit = async (event) => {
    event.preventDefault();
    const errorEl = $('requestError');
    const btn = $('requestBtn');
    errorEl.style.display = 'none';
    btn.disabled = true;
    try {
      const result = await API.requestData({
        name: $('reqName').value.trim(),
        role: selected('role'),
        roleOther: $('reqRoleOther').value.trim(),
        organization: $('reqOrg').value.trim(),
        dataType: $('reqType').value,
        purpose: $('reqPurpose').value.trim(),
        delivery: selected('delivery'),
        email: $('reqEmail').value.trim()
      });
      $('requestForm').reset();
      $('reqName').value = me.name || '';
      $('reqRoleOther').hidden = true;
      $('reqEmail').hidden = true;
      $('purposeCount').textContent = '0';
      requestCount++;
      renderTracker(result.request);
      toast('Request sent — expect the data at ' + result.email + ' in 3–5 working days');
    } catch (error) {
      errorEl.textContent = error.message.startsWith('Missing required')
        ? 'Please fill in every field before submitting.'
        : error.message;
      errorEl.style.display = 'flex';
    } finally {
      btn.disabled = false;
    }
  };
}
</script>
</body>
</html>
