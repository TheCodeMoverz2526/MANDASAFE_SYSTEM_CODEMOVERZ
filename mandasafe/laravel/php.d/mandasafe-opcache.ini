; Extra PHP settings for MandaSafe, loaded through PHP_INI_SCAN_DIR by
; start-mandasafe.bat. This file ADDS to the PHP installation's own php.ini —
; it does not replace it, so every extension XAMPP already loads stays loaded.
;
; Without OPcache, PHP recompiles the whole Laravel framework from disk on every
; single request. On a OneDrive-synced folder that measured ~250ms per API call;
; with these settings the same call answers in ~10ms.
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Keep checking file timestamps so edits to the PHP source still take effect —
; this is a development server, correctness beats the last few milliseconds.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
