<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety Index — MandaSafe</title>
<link rel="icon" href="assets/logo-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<main class="main">
  <div class="page-head">
    <div><h1>Safety Index</h1>
      <p>A single score for Mandaluyong's road safety, computed from the recorded data.</p></div>
    <div class="spacer"></div>
    <span class="pill"><span class="live"></span> <span id="range">Loading…</span></span>
  </div>

  <div class="grid g-main">
    <div class="card">
      <div class="card-head"><h2>Overall Safety Index</h2></div>
      <div class="card-body gauge-wrap">
        <div class="gauge">
          <svg viewBox="0 0 200 118" style="width:100%">
            <path d="M14 108a86 86 0 01172 0" fill="none" stroke="#eef2f7" stroke-width="17" stroke-linecap="round"/>
            <path id="arc" d="M14 108a86 86 0 01172 0" fill="none" stroke="#16a34a" stroke-width="17" stroke-linecap="round"
                  stroke-dasharray="270" stroke-dashoffset="270"/>
          </svg>
          <div style="margin-top:-64px">
            <div class="score" id="score">—</div>
            <div class="score-lbl" id="scoreLabel">Calculating…</div>
          </div>
          <div class="gauge-ends" style="margin-top:22px"><span>0</span><span>100</span></div>
        </div>
        <div class="score-delta" id="delta"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Index by Category</h2></div>
      <div class="card-body" id="cats"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <div class="card-body"><div class="notice"><span class="ni" data-i="shield"></span>
      <div><h4>What does this mean?</h4><p id="explain">Calculating…</p></div></div></div>
  </div>

  <div class="grid g-2" style="margin-top:18px">
    <div class="card"><div class="card-head"><h2>Accident Types</h2></div>
      <div class="card-body" id="types"></div></div>
    <div class="card"><div class="card-head"><h2>Severity Mix</h2></div>
      <div class="card-body" id="sev"></div></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
if (requireAuth()) {
  buildShell('safety');

  (async () => {
    let s;
    try { s = await API.summary(); }
    catch (error) {
      document.getElementById('range').textContent = 'Server offline';
      setState(document.getElementById('cats'), error.message, true);
      return;
    }

    document.getElementById('range').textContent = `${fmtDate(s.range.from)} – ${fmtDate(s.range.to)}`;

    // The index is computed once on the server (the same one the TPMO console shows), from
    // the recorded data only. Categories the records can't support are listed, not scored.
    const safety = s.safety || {};
    const CATS = (safety.categories || []).map(c => ({ n: c.name, v: c.score, why: c.why, detail: c.detail }));
    const overall = safety.overall ?? 0;
    const label = safety.level || 'No data';
    const color = overall >= 75 ? '#16a34a' : overall >= 50 ? '#f59e0b' : '#dc2626';

    document.getElementById('score').textContent = safety.overall ?? '—';
    document.getElementById('score').style.color = color;
    document.getElementById('scoreLabel').textContent = label;
    document.getElementById('scoreLabel').style.color = color;
    const w = safety.window;
    document.getElementById('delta').textContent =
      `Based on ${num(s.totalIncidents)} recorded accidents across ${s.barangayCount} barangays` +
      (w ? ` · latest 3 months: ${fmtMonth(w.recentFrom)} – ${fmtMonth(w.recentTo)}` : '');

    const arc = document.getElementById('arc');
    arc.setAttribute('stroke', color);
    setTimeout(() => { arc.style.transition = 'stroke-dashoffset 1s ease'; arc.style.strokeDashoffset = 270 - 270 * (overall / 100); }, 120);

    document.getElementById('cats').innerHTML = CATS.map(c => {
      const v = Math.round(c.v);
      const fill = v >= 75 ? 'fill-g' : v >= 50 ? 'fill-a' : 'fill-r';
      const word = v >= 75 ? 'Good' : v >= 50 ? 'Fair' : 'Low';
      return `<div class="bar-row" title="${esc(c.why)}">
        <span class="cat">${esc(c.n)}</span>
        <span class="bar"><i class="${fill}" style="width:0%" data-w="${v}"></i></span>
        <span class="val">${v}</span>
        <span class="${v >= 75 ? 't-good' : 't-fair'}">${word}</span></div>
        <div style="font-size:11.5px;color:#64748b;margin:-4px 0 10px">${esc(c.detail || c.why)}</div>`;
    }).join('') + (safety.excluded || []).map(e =>
      `<div style="font-size:11.5px;color:#94a3b8;margin-top:6px"><b>${esc(e.name)}</b> is not scored — ${esc(e.reason)}</div>`).join('');
    setTimeout(() => document.querySelectorAll('.bar i').forEach(b => {
      b.style.transition = 'width .9s ease'; b.style.width = b.dataset.w + '%';
    }), 150);

    const worst = [...CATS].sort((a, b) => a.v - b.v)[0];
    const rising = (safety.rising || [])[0];
    document.getElementById('explain').innerHTML = !CATS.length ? 'There are not enough records to score yet.' :
      `Mandaluyong's road safety currently scores <b>${overall}/100 (${esc(label.toLowerCase())})</b>, from ` +
      `${CATS.map(c => esc(c.n.toLowerCase())).join(' and ')}. ` +
      `The weakest is <b>${esc(worst.n)}</b> (${Math.round(worst.v)}/100): ${esc(worst.detail || worst.why)}. ` +
      (rising ? `Accidents are rising most in <b>${esc(rising.barangay)}</b> (${rising.earlierAvg} → ${rising.recentAvg} a month).` : 'No barangay shows a meaningful rise.');

    barChart(document.getElementById('types'), s.byType.map(t => ({ label: t.type, value: t.count })));
    barChart(document.getElementById('sev'), s.bySeverity.map(x => ({
      label: x.sev, value: x.count, color: sevMeta(x.sev).color
    })));
    if (!s.severityTracked) document.getElementById('sev').insertAdjacentHTML('beforeend',
      '<p style="font-size:12px;color:#94a3b8;margin-top:10px">Every record has the same severity, so severity is not being recorded yet.</p>');
  })();

}
</script>
</body>
</html>
