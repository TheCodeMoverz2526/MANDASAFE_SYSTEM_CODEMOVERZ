# MandaSafe — Nginx site. setup-server.sh fills in __DOMAIN__ and __SITE__ and installs this
# as /etc/nginx/sites-available/mandasafe. Certbot then adds the HTTPS (443) server block.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Laravel's public folder. Nothing else in the project is reachable except the
    # static files listed below — the same allowlist StaticSiteController applies.
    root __SITE__/laravel/public;
    index index.php;

    client_max_body_size 20m;   # CSV / Excel imports of accident records

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static files the pages load, straight from disk.
    # Leaflet and the images practically never change: kept a day without asking.
    location ~ ^/(assets|vendor)/ {
        root __SITE__;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }
    # Our own CSS/JS: revalidated on every load, so an edit shows up straight away.
    location ~ ^/(css|js)/ {
        root __SITE__;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        access_log off;
    }
    location = /data/mandaluyong-barangays.geojson { root __SITE__; add_header Cache-Control "no-cache"; }
    location ~ ^/(script\.js|login\.js|styles\.css)$  { root __SITE__; add_header Cache-Control "no-cache"; }

    # Pages (/, *.html) and the API (/api/...) go through Laravel.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # The Random Forest and the hotspot model can take ~15 s when the cache is cold.
        fastcgi_read_timeout 120;
    }

    # Dotfiles (.env, .git …) are never served.
    location ~ /\.(?!well-known) { deny all; }
}
