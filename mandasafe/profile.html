<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — MandaSafe</title>
<link rel="icon" href="assets/logo-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<script src="js/page-loader.js"></script>
<main class="main">
  <div class="page-head"><div><h1>My Account</h1><p>Your MandaSafe account details.</p></div></div>

  <div class="card">
    <div class="card-head"><h2>Account Information</h2>
      <button type="button" class="btn btn-ghost" id="editProfileBtn" style="margin-left:auto;display:none;padding:8px 16px;font-size:13px;">Edit</button>
    </div>
    <div class="card-body" id="info"><div class="empty">Loading…</div></div>
  </div>

  <div class="card" id="requestsCard" style="margin-top:20px" hidden>
    <div class="card-head"><h2>My Data Requests</h2>
      <a class="btn btn-ghost" href="data-request.html" style="margin-left:auto;padding:8px 16px;font-size:13px;">New Request</a>
    </div>
    <div id="requestsList"></div>
  </div>
</main>

<!-- Data request details: opened by clicking a request in My Data Requests -->
<div class="ms-modal" id="rqModal" role="dialog" aria-modal="true" aria-labelledby="rqTitle" hidden>
  <div class="ms-modal-card rq-card">
    <button type="button" class="rq-x" aria-label="Close">&times;</button>
    <div id="rqBody"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
if (requireAuth()) {
  buildShell('profile');
  let me;

  function renderView() {
    document.getElementById('editProfileBtn').style.display = '';
    document.getElementById('info').innerHTML = `
      <div class="pf-avatar" style="background:${me.color}22;color:${me.color}">${esc(me.avatar)}</div>
      <div class="pf-row"><span class="k">Full Name</span><span class="v">${esc(me.name)}</span></div>
      <div class="pf-row"><span class="k">Email Address</span><span class="v">${esc(me.email)}</span></div>
      <div class="pf-row"><span class="k">Contact Number</span><span class="v">${esc(me.phone || '—')}</span></div>
      <div class="pf-row"><span class="k">Office / Area</span><span class="v">${esc(me.dept || '—')}</span></div>
      <div class="pf-row"><span class="k">Account Created</span><span class="v">${new Date(me.createdAt).toLocaleDateString()}</span></div>
      <div class="pf-row"><span class="k">Last Sign In</span><span class="v">${me.lastLoginAt ? new Date(me.lastLoginAt).toLocaleString() : 'This is your first session'}</span></div>`;
  }

  function renderEdit() {
    document.getElementById('editProfileBtn').style.display = 'none';
    document.getElementById('info').innerHTML = `
      <div class="field"><label for="editName">Full Name</label>
        <input class="input" id="editName" value="${esc(me.name)}"></div>
      <div class="field"><label for="editEmail">Email Address</label>
        <input class="input" id="editEmail" type="email" value="${esc(me.email)}"></div>
      <div class="field"><label for="editPhone">Contact Number</label>
        <input class="input" id="editPhone" type="tel" value="${esc(me.phone || '')}"></div>
      <div id="editProfileError" class="notice notice-amber" style="display:none;margin-bottom:16px"></div>
      <div style="display:flex;gap:10px">
        <button type="button" class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
        <button type="button" class="btn btn-ghost" id="cancelProfileBtn">Cancel</button>
      </div>`;

    document.getElementById('cancelProfileBtn').onclick = renderView;
    document.getElementById('saveProfileBtn').onclick = async () => {
      const body = {
        name: document.getElementById('editName').value.trim(),
        email: document.getElementById('editEmail').value.trim(),
        phone: document.getElementById('editPhone').value.trim()
      };
      const errorEl = document.getElementById('editProfileError');
      const saveBtn = document.getElementById('saveProfileBtn');
      saveBtn.disabled = true;
      try {
        me = await API.updateProfile(body);
        const session = currentUser();
        if (session) localStorage.setItem(SESSION_KEY, JSON.stringify({ ...session, ...me }));
        const nameEl = document.querySelector('.userchip .nm');
        const avatarEl = document.querySelector('.userchip .avatar');
        if (nameEl) nameEl.textContent = me.name;
        if (avatarEl) avatarEl.textContent = me.avatar;
        renderView();
        toast('Profile updated');
      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'flex';
        saveBtn.disabled = false;
      }
    };
  }

  (async () => {
    try { me = await API.me(); }
    catch (error) { setState(document.getElementById('info'), error.message, true); return; }

    renderView();
    document.getElementById('editProfileBtn').onclick = renderEdit;
  })();

  // The card stays hidden until the account has sent at least one request.
  const REQUEST_STATUS = { pending: ['Under Review', 't-review'], approved: ['Accepted', 't-process'], sent: ['Sent', 't-resolved'], declined: ['Declined', 't-high'] };
  (async () => {
    let requests;
    try { requests = await API.dataRequests(); }
    catch { return; }
    if (!requests.length) return;

    myRequests = requests;
    document.getElementById('requestsList').innerHTML = requests.map((r, i) => {
      const [label, tag] = REQUEST_STATUS[r.status] || [r.status, 't-review'];
      return `<div class="inc inc-click" role="button" tabindex="0" title="View details" data-index="${i}">
        <div class="ic" style="background:var(--blue-600)">${icon('file')}</div>
        <div>
          <div class="t">${esc(r.dataType)}</div>
          <div class="l">${esc(r.purpose)}</div>
          <div class="d">${new Date(r.createdAt).toLocaleString()} · ${esc(r.role)}, ${esc(r.organization)} · to ${esc(r.email)}</div>
          ${r.status === 'declined' && r.declineReason ? `<div class="d" style="color:#b91c1c"><b>Reason declined:</b> ${esc(r.declineReason)}</div>` : ''}
        </div>
        <span class="tag ${tag}">${esc(label)}</span>
      </div>`;
    }).join('');
    document.getElementById('requestsCard').hidden = false;
  })();

  // Clicking a request (or Enter on it) opens the whole request in a popup.
  let myRequests = [];
  const REQUEST_NOTE = {
    pending: 'The office is reviewing your request. Data is usually sent within 3–5 working days.',
    approved: 'Your request was accepted. The data will be emailed to the address below.',
    sent: 'The data was sent to the email address below. Check your spam folder if you cannot find it.'
  };

  // Every step with the date it was reached. Requests that moved along before the dates were
  // kept have none for the steps they passed, so those read "Done" rather than a blank.
  function requestSteps(r) {
    const when = iso => iso ? new Date(iso).toLocaleString() : '';
    const steps = [{ label: 'Request Submitted', date: when(r.createdAt), state: 'done' }];
    if (r.status === 'declined') {
      steps.push({ label: 'Declined', date: when(r.declinedAt) || 'Done', state: 'declined' });
    } else {
      const accepted = r.status === 'approved' || r.status === 'sent';
      steps.push({ label: 'Under Review', date: accepted ? 'Done' : 'In progress', state: accepted ? 'done' : 'current' });
      steps.push({ label: 'Accepted', date: when(r.approvedAt) || (accepted ? 'Done' : 'Waiting'),
                   state: accepted ? 'done' : '' });
      steps.push({ label: 'Data Sent', date: when(r.sentAt) || (r.status === 'sent' ? 'Done' : r.status === 'approved' ? 'Being prepared' : 'Waiting'),
                   state: r.status === 'sent' ? 'done' : r.status === 'approved' ? 'current' : '' });
    }
    return steps.map(s => `<li class="${s.state}"><span class="rq-dot"></span><div><div class="rq-step">${s.label}</div><div class="rq-date">${esc(s.date)}</div></div></li>`).join('');
  }

  function openRequestDetails(r) {
    const [label, tag] = REQUEST_STATUS[r.status] || [r.status, 't-review'];
    const item = (name, value) => `<div class="rq-item"><div class="rq-label">${name}</div><div class="rq-value">${value}</div></div>`;
    const note = r.status === 'declined'
      ? `<div class="rq-note rq-declined"><b>Reason for declining</b>${esc(r.declineReason || 'No reason was given. Please contact support.')}</div>`
      : `<div class="rq-note">${REQUEST_NOTE[r.status] || ''}</div>`;

    document.getElementById('rqBody').innerHTML = `
      <div class="rq-head">
        <div><div class="rq-id">REQ-${String(r.id).padStart(4, '0')}</div><h3 id="rqTitle">${esc(r.dataType)}</h3></div>
        <span class="tag ${tag}">${esc(label)}</span>
      </div>
      ${note}
      <div class="rq-label" style="margin-bottom:8px">Progress</div>
      <ol class="rq-steps">${requestSteps(r)}</ol>
      <div class="rq-grid">
        ${item('Name', esc(r.name))}
        ${item('Role', esc(r.role))}
        ${item('Organization', esc(r.organization))}
        ${item('Data type', esc(r.dataType))}
      </div>
      <div class="rq-item rq-wide"><div class="rq-label">Send to</div><div class="rq-value">${esc(r.email)}</div></div>
      <div class="rq-item rq-wide"><div class="rq-label">Purpose of Request</div><div class="rq-value rq-purpose">${esc(r.purpose)}</div></div>
      <div class="rq-actions">
        ${r.status === 'declined' ? '<a class="btn btn-ghost" href="data-request.html">Send a New Request</a>' : '<a class="btn btn-ghost" href="support.html">Contact Support</a>'}
        <button type="button" class="btn btn-primary" id="rqCloseBtn">Close</button>
      </div>`;
    document.getElementById('rqModal').hidden = false;
    document.getElementById('rqCloseBtn').onclick = closeRequestDetails;
    document.getElementById('rqCloseBtn').focus();
  }

  function closeRequestDetails() { document.getElementById('rqModal').hidden = true; }

  const requestsList = document.getElementById('requestsList');
  const openFromEvent = e => {
    const row = e.target.closest('.inc-click');
    if (row) openRequestDetails(myRequests[Number(row.dataset.index)]);
  };
  requestsList.addEventListener('click', openFromEvent);
  requestsList.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openFromEvent(e); }
  });
  document.getElementById('rqModal').addEventListener('click', e => {
    if (e.target.id === 'rqModal' || e.target.closest('.rq-x')) closeRequestDetails();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('rqModal').hidden) closeRequestDetails();
  });
}
</script>
</body>
</html>
