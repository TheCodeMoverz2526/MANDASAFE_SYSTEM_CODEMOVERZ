<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — MandaSafe</title>
<link rel="icon" href="assets/logo-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<main class="main">
  <div class="page-head"><div><h1>My Account</h1><p>Your MandaSafe account details.</p></div></div>

  <div class="card">
    <div class="card-head"><h2>Account Information</h2>
      <button type="button" class="btn btn-ghost" id="editProfileBtn" style="margin-left:auto;display:none;padding:8px 16px;font-size:13px;">Edit</button>
    </div>
    <div class="card-body" id="info"><div class="empty">Loading…</div></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
if (requireAuth()) {
  buildShell('profile');
  let me;

  function renderView() {
    document.getElementById('editProfileBtn').style.display = '';
    document.getElementById('info').innerHTML = `
      <div class="pf-avatar" style="background:${me.color}22;color:${me.color}">${esc(me.avatar)}</div>
      <div class="pf-row"><span class="k">Full Name</span><span class="v">${esc(me.name)}</span></div>
      <div class="pf-row"><span class="k">Email Address</span><span class="v">${esc(me.email)}</span></div>
      <div class="pf-row"><span class="k">Contact Number</span><span class="v">${esc(me.phone || '—')}</span></div>
      <div class="pf-row"><span class="k">Office / Area</span><span class="v">${esc(me.dept || '—')}</span></div>
      <div class="pf-row"><span class="k">Account Created</span><span class="v">${new Date(me.createdAt).toLocaleDateString()}</span></div>
      <div class="pf-row"><span class="k">Last Sign In</span><span class="v">${me.lastLoginAt ? new Date(me.lastLoginAt).toLocaleString() : 'This is your first session'}</span></div>`;
  }

  function renderEdit() {
    document.getElementById('editProfileBtn').style.display = 'none';
    document.getElementById('info').innerHTML = `
      <div class="field"><label for="editName">Full Name</label>
        <input class="input" id="editName" value="${esc(me.name)}"></div>
      <div class="field"><label for="editEmail">Email Address</label>
        <input class="input" id="editEmail" type="email" value="${esc(me.email)}"></div>
      <div class="field"><label for="editPhone">Contact Number</label>
        <input class="input" id="editPhone" type="tel" value="${esc(me.phone || '')}"></div>
      <div id="editProfileError" class="notice notice-amber" style="display:none;margin-bottom:16px"></div>
      <div style="display:flex;gap:10px">
        <button type="button" class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
        <button type="button" class="btn btn-ghost" id="cancelProfileBtn">Cancel</button>
      </div>`;

    document.getElementById('cancelProfileBtn').onclick = renderView;
    document.getElementById('saveProfileBtn').onclick = async () => {
      const body = {
        name: document.getElementById('editName').value.trim(),
        email: document.getElementById('editEmail').value.trim(),
        phone: document.getElementById('editPhone').value.trim()
      };
      const errorEl = document.getElementById('editProfileError');
      const saveBtn = document.getElementById('saveProfileBtn');
      saveBtn.disabled = true;
      try {
        me = await API.updateProfile(body);
        const session = currentUser();
        if (session) localStorage.setItem(SESSION_KEY, JSON.stringify({ ...session, ...me }));
        const nameEl = document.querySelector('.userchip .nm');
        const avatarEl = document.querySelector('.userchip .avatar');
        if (nameEl) nameEl.textContent = me.name;
        if (avatarEl) avatarEl.textContent = me.avatar;
        renderView();
        toast('Profile updated');
      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'flex';
        saveBtn.disabled = false;
      }
    };
  }

  (async () => {
    try { me = await API.me(); }
    catch (error) { setState(document.getElementById('info'), error.message, true); return; }

    renderView();
    document.getElementById('editProfileBtn').onclick = renderEdit;
  })();
}
</script>
</body>
</html>
